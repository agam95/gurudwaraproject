backend:
  name: github
  repo: agam95/gurudwaraproject
  branch: main

local_backend: true

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - label: "Startsida"
    name: "homepage"
    editor:
      preview: false
    files:
      - label: "Program och aktiviteter"
        name: "programs"
        file: "data/programs.json"
        format: "json"
        fields:
          - label: "Programkort"
            name: "items"
            widget: "list"
            summary: "{{fields.title.sv}}"
            fields:
              - label: "Dag"
                name: "day"
                widget: "object"
                fields:
                  - { label: "Svenska", name: "sv", widget: "string" }
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Punjabi", name: "pa", widget: "string" }
              - label: "Rubrik"
                name: "title"
                widget: "object"
                fields:
                  - { label: "Svenska", name: "sv", widget: "string" }
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Punjabi", name: "pa", widget: "string" }
              - label: "Beskrivning"
                name: "description"
                widget: "object"
                fields:
                  - { label: "Svenska", name: "sv", widget: "text" }
                  - { label: "English", name: "en", widget: "text" }
                  - { label: "Punjabi", name: "pa", widget: "text" }
              - label: "Tid"
                name: "time"
                widget: "object"
                required: false
                fields:
                  - { label: "Svenska", name: "sv", widget: "string", required: false }
                  - { label: "English", name: "en", widget: "string", required: false }
                  - { label: "Punjabi", name: "pa", widget: "string", required: false }
              - { label: "Länk URL", name: "link_url", widget: "string", required: false }
              - label: "Länktext"
                name: "link_label"
                widget: "object"
                required: false
                fields:
                  - { label: "Svenska", name: "sv", widget: "string", required: false }
                  - { label: "English", name: "en", widget: "string", required: false }
                  - { label: "Punjabi", name: "pa", widget: "string", required: false }

  - label: "Protokoll"
    name: "documents"
    editor:
      preview: false
    files:
      - label: "Protokoll och filer"
        name: "document_library"
        file: "data/documents.json"
        format: "json"
        fields:
          - label: "Dokumentkort"
            name: "items"
            widget: "list"
            summary: "{{fields.title.sv}}"
            fields:
              - label: "Övertext"
                name: "meta"
                widget: "object"
                fields:
                  - { label: "Svenska", name: "sv", widget: "string" }
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Punjabi", name: "pa", widget: "string" }
              - label: "Rubrik"
                name: "title"
                widget: "object"
                fields:
                  - { label: "Svenska", name: "sv", widget: "string" }
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Punjabi", name: "pa", widget: "string" }
              - label: "Beskrivning"
                name: "summary"
                widget: "object"
                fields:
                  - { label: "Svenska", name: "sv", widget: "text" }
                  - { label: "English", name: "en", widget: "text" }
                  - { label: "Punjabi", name: "pa", widget: "text" }
              - label: "Knapptext"
                name: "link_label"
                widget: "object"
                fields:
                  - { label: "Svenska", name: "sv", widget: "string" }
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Punjabi", name: "pa", widget: "string" }
              - label: "Fil"
                name: "file"
                widget: "file"
                required: false
                allow_multiple: false
